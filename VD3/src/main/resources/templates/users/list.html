<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Users</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><h1>Quản lý Users</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="toolbar"><form th:action="@{/users}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm username, email, họ tên"><button class="button">Tìm kiếm</button></form><a class="button" th:href="@{/users/create}">+ Thêm User</a></div><table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th><th>Role</th><th>Enabled</th><th>Products</th><th>Action</th></tr></thead><tbody><tr th:each="u:${users.content}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.roleName}"></td><td th:text="${u.enabled?'Yes':'No'}"></td><td th:text="${u.productCount}"></td><td><a th:href="@{/users/edit/{id}(id=${u.id})}">Edit</a> <form class="inline" th:action="@{/users/delete/{id}(id=${u.id})}" method="post"><button class="danger-link">Delete</button></form></td></tr><tr th:if="${users.empty}"><td colspan="8">Không có dữ liệu.</td></tr></tbody></table><div class="pagination" th:if="${users.totalPages>1}"><a th:if="${users.number>0}" th:href="@{/users(page=${users.number-1},size=${size},keyword=${keyword})}">«</a><a th:each="p:${#numbers.sequence(0,users.totalPages-1)}" th:classappend="${p==users.number?'active':''}" th:href="@{/users(page=${p},size=${size},keyword=${keyword})}" th:text="${p+1}"></a><a th:if="${users.number+1<users.totalPages}" th:href="@{/users(page=${users.number+1},size=${size},keyword=${keyword})}">»</a></div></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
