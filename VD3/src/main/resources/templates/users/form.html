\```html
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">

    <div class="form-card">

        <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">
            User
        </h1>

        <form th:action="${mode == 'create' ? '/users/create' : '/users/edit/' + userDTO.id}"
              th:object="${userDTO}"
              method="post">

            <div class="form-group">
                <label for="username">Username</label>

                <input id="username"
                       type="text"
                       th:field="*{username}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}">
                </div>
            </div>


            <div class="form-group">
                <label for="email">Email</label>

                <input id="email"
                       type="email"
                       th:field="*{email}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>
            </div>


            <div class="form-group">
                <label for="fullName">Họ tên</label>

                <input id="fullName"
                       type="text"
                       th:field="*{fullName}"
                       required>

                <div class="error"
                     th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}">
                </div>
            </div>


            <div class="form-group">
                <label for="roleName">Role</label>

                <select id="roleName"
                        th:field="*{roleName}">

                    <option value="ROLE_USER">USER</option>
                    <option value="ROLE_ADMIN">ADMIN</option>

                </select>

                <div class="error"
                     th:if="${#fields.hasErrors('roleName')}"
                     th:errors="*{roleName}">
                </div>
            </div>


            <div class="form-group">

                <label class="check">

                    <input type="checkbox"
                           th:field="*{enabled}">

                    Enabled

                </label>

                <div class="error"
                     th:if="${#fields.hasErrors('enabled')}"
                     th:errors="*{enabled}">
                </div>

            </div>


            <button type="submit"
                    class="button">
                Lưu
            </button>

            <a class="button secondary"
               th:href="@{/users}">
                Hủy
            </a>

        </form>


        <p class="note">
            Mật khẩu mặc định của user do Admin tạo:
            <b>123456</b>.
        </p>

    </div>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
```
