<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Products</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><h1>Quản lý Products</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="toolbar"><form th:action="@{/products}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm kiếm sản phẩm"><button class="button">Tìm kiếm</button></form><a class="button" th:href="@{/products/create}">+ Thêm Product</a></div><table><thead><tr><th>ID</th><th>Ảnh</th><th>Name</th><th>Price</th><th>User</th><th>Action</th></tr></thead><tbody><tr th:each="p:${products.content}"><td th:text="${p.id}"></td><td><img th:if="${p.imageUrl!=null}" class="thumb" th:src="${#strings.contains(p.imageUrl,'|')?#strings.substringBefore(p.imageUrl,'|'):p.imageUrl}"><span th:if="${p.imageUrl==null}">No image</span></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.username}"></td><td><a th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a> <form class="inline" th:action="@{/products/delete/{id}(id=${p.id})}" method="post"><button class="danger-link">Delete</button></form></td></tr><tr th:if="${products.empty}"><td colspan="6">Không có dữ liệu.</td></tr></tbody></table><div class="pagination" th:if="${products.totalPages>1}"><a th:if="${products.number>0}" th:href="@{/products(page=${products.number-1},size=${size},keyword=${keyword})}">«</a><a th:each="p:${#numbers.sequence(0,products.totalPages-1)}" th:classappend="${p==products.number?'active':''}" th:href="@{/products(page=${p},size=${size},keyword=${keyword})}" th:text="${p+1}"></a><a th:if="${products.number+1<products.totalPages}" th:href="@{/products(page=${products.number+1},size=${size},keyword=${keyword})}">»</a></div></main><footer th:replace="~{fragments/footer :: footer}"></footer></body></html>
