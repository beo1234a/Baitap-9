<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>Quên mật khẩu</h1>

    <p class="subtitle">
        Nhập email của bạn để nhận mã OTP đặt lại mật khẩu.
    </p>

    <form th:action="@{/forgot-password}"
          th:object="${forgotPasswordDTO}"
          method="post">

        <!-- Global error -->
        <div th:if="${#fields.hasGlobalErrors()}"
             class="alert error">

            <span th:each="e : ${#fields.globalErrors()}"
                  th:text="${e}">
            </span>

        </div>

        <!-- Success message -->
        <div th:if="${success}"
             class="alert success"
             th:text="${success}">
        </div>

        <!-- Error message -->
        <div th:if="${error}"
             class="alert error"
             th:text="${error}">
        </div>

        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="Nhập email của bạn"
                   required>

            <div class="error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>

        </div>

        <button type="submit"
                class="button full">
            Gửi mã OTP
        </button>

    </form>

    <p class="mt">
        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>
    </p>

</div>

</body>
</html>
