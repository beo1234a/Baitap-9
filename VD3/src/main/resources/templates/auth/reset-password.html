<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt lại mật khẩu</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>Đặt lại mật khẩu</h1>

    <p class="subtitle">
        Nhập email, mã OTP và mật khẩu mới của bạn.
    </p>

    <form th:action="@{/reset-password}"
          th:object="${resetPasswordDTO}"
          method="post">

        <!-- Lỗi chung -->
        <div th:if="${#fields.hasGlobalErrors()}"
             class="alert error">

            <span th:each="e : ${#fields.globalErrors()}"
                  th:text="${e}">
            </span>

        </div>

        <!-- Thông báo thành công -->
        <div th:if="${success}"
             class="alert success"
             th:text="${success}">
        </div>

        <!-- Thông báo lỗi -->
        <div th:if="${error}"
             class="alert error"
             th:text="${error}">
        </div>


        <!-- EMAIL -->
        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="Nhập email"
                   required>

            <div class="error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>

        </div>


        <!-- OTP -->
        <div class="form-group">

            <label for="otp">
                Mã OTP
            </label>

            <input type="text"
                   id="otp"
                   th:field="*{otp}"
                   maxlength="6"
                   placeholder="Nhập mã OTP 6 số"
                   required>

            <div class="error"
                 th:if="${#fields.hasErrors('otp')}"
                 th:errors="*{otp}">
            </div>

        </div>


        <!-- MẬT KHẨU MỚI -->
        <div class="form-group">

            <label for="password">
                Mật khẩu mới
            </label>

            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="Nhập mật khẩu mới"
                   required>

            <div class="error"
                 th:if="${#fields.hasErrors('password')}"
                 th:errors="*{password}">
            </div>

        </div>


        <!-- XÁC NHẬN MẬT KHẨU -->
        <div class="form-group">

            <label for="confirmPassword">
                Xác nhận mật khẩu
            </label>

            <input type="password"
                   id="confirmPassword"
                   th:field="*{confirmPassword}"
                   placeholder="Nhập lại mật khẩu mới"
                   required>

            <div class="error"
                 th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}">
            </div>

        </div>


        <button type="submit"
                class="button full">
            Đặt lại mật khẩu
        </button>

    </form>


    <p class="mt">
        <a th:href="@{/login}">
            Quay lại đăng nhập
        </a>
    </p>

</div>

</body>

</html>
