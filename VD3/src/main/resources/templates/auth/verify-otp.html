<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Xác nhận OTP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="auth-page">

<div class="auth-card">

    <h1>Xác nhận OTP</h1>

    <div th:if="${success}"
         class="alert success"
         th:text="${success}">
    </div>

    <form th:action="@{/verify-otp}"
          th:object="${verifyOtpDTO}"
          method="post">

        <div th:if="${#fields.hasGlobalErrors()}"
             class="alert error">

            <span th:each="e : ${#fields.globalErrors()}"
                  th:text="${e}">
            </span>

        </div>

        <label>Email</label>

        <input type="email"
               th:field="*{email}"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>

        <label>OTP 6 số</label>

        <input type="text"
               th:field="*{otp}"
               maxlength="6"
               required>

        <div class="error"
             th:if="${#fields.hasErrors('otp')}"
             th:errors="*{otp}">
        </div>

        <button type="submit"
                class="button full">
            Xác nhận
        </button>

    </form>

    <form th:action="@{/resend-register-otp}"
          method="post"
          class="mt">

        <input type="hidden"
               name="email"
               th:value="${verifyOtpDTO.email}">

        <button type="submit"
                class="button secondary full">
            Gửi lại OTP
        </button>

    </form>

    <p>
        <a th:href="@{/login}">
            Quay lại Login
        </a>
    </p>

</div>

</body>
</html>
