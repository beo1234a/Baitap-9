<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UTEShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Đăng nhập</h2>
        <p class="text-muted mb-0">Custom Login - Spring Security</p>
    </div>
    <div th:if="${param.error}" class="alert alert-danger">Username/email hoặc password không đúng</div>
    <div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username hoặc Email</label>
            <input type="text" name="username" class="form-control" placeholder="Nhập username hoặc email" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Nhập password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
    </form>
    <div class="demo-box mt-4">
        <strong>Tài khoản mẫu</strong><br>
        Username: <b>user01</b><br>
        Email: <b>user01@gmail.com</b><br>
        Password: <b>123456</b>
    </div>
</div>
</body>
</html>
