<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="header">

    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold text-primary"
               th:href="@{/}">
                UTEShop
            </a>

            <div class="ms-auto d-flex align-items-center gap-3"
                 sec:authorize="isAuthenticated()">

                <img th:src="@{${#authentication.principal.images}}"
                     alt="Ảnh đại diện"
                     class="avatar">

                <div class="user-info">
                    <div class="fw-semibold"
                         th:text="${#authentication.principal.fullName}">
                        Nguyễn Anh Tuấn
                    </div>

                    <div class="text-muted small">
                        <span th:text="${#authentication.principal.username}">
                            user01
                        </span>
                        -
                        <span th:text="${#authentication.principal.email}">
                            user01@gmail.com
                        </span>
                    </div>

                    <div class="text-primary small"
                         th:text="${#authentication.principal.role}">
                        ROLE_USER
                    </div>
                </div>

                <form th:action="@{/logout}"
                      method="post"
                      class="m-0">

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm">
                        Đăng xuất
                    </button>

                </form>

            </div>

        </div>
    </nav>

</header>

</body>
</html>
