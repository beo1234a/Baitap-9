<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
    <section class="hero">
        <h1>Trang chủ IOTSTAR SHOP</h1>

        <div sec:authorize="isAuthenticated()" class="panel">
            <h2>Thông tin đăng nhập</h2>
            <p><strong>Email:</strong> <span sec:authentication="name"></span></p>
            <p><strong>Quyền:</strong> <span sec:authentication="principal.authorities"></span></p>
        </div>

        <div sec:authorize="!isAuthenticated()" class="panel">
            <p>Bạn chưa đăng nhập.</p>
            <a class="btn primary" th:href="@{/login}">Đăng nhập</a>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
