<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard}">Dashboard</a>
    </nav>

    <div class="account" sec:authorize="isAuthenticated()">
        <span>Xin chào, </span>
        <strong sec:authentication="name"></strong>
        <span sec:authentication="principal.authorities"></span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="link-button">Đăng xuất</button>
        </form>
    </div>

    <div class="account" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" class="login-link">Đăng nhập</a>
    </div>
</header>
</body>
</html>
