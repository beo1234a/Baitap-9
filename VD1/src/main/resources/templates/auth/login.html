<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng nhập</h2>

    <div th:if="${param.error}" class="alert error">
        Email hoặc mật khẩu không đúng.
    </div>

    <div th:if="${param.logout}" class="alert success">
        Bạn đã đăng xuất.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username">

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">

        <button type="submit" class="btn primary full mt">Đăng nhập</button>
    </form>

    <p class="mt">
        Tài khoản mẫu:
        <strong>user@example.com</strong> / <strong>123456</strong>
    </p>
    <p>
        Admin:
        <strong>admin@example.com</strong> / <strong>123456</strong>
    </p>
</main>
</body>
</html>
